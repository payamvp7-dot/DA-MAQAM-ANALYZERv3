name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target DAMaqamAnalyzer_VST3 --parallel 2

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DA-MAQAM-ANALYZER-Windows-VST3
          path: build/DAMaqamAnalyzer_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
